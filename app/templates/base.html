<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1119">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Sport Data Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('sda.index') }}">
      <span class="brand-mark">▲</span>
      <span>Sport Data Analyzer</span>
    </a>
    <nav class="topnav">
      {% set me = current_paddler() %}
      {% if me %}
        <span class="who" title="{{ me.email }}">{{ me.name }}</span>
        <form method="post" action="{{ url_for('sda.logout') }}" class="inline-form">
          <button type="submit" class="link-muted">sign out</button>
        </form>
      {% else %}
        <a class="link-muted" href="{{ url_for('sda.login') }}">sign in</a>
      {% endif %}
      <a class="link-muted" href="{{ url_for('sda.healthz') }}">status</a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
