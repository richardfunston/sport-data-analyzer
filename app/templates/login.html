{% extends "base.html" %}

{% block title %}Sign in · Sport Data Analyzer{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Sign in</h1>
  <p class="auth-sub">Paddler accounts only — ask an admin to add you.</p>

  {% if error %}
  <p class="auth-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('sda.login') }}" class="auth-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}"
           autocomplete="username" inputmode="email" autocapitalize="none"
           spellcheck="false" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
